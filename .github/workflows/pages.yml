# Build, test and publish the page to GitHub Pages at
# https://abap2ui5-addons.github.io/.
#
# On a pull request it builds and tests only. On main, and once a day, it
# also deploys. Before the build it fetches the stars of every repository.
#
# Needs Settings → Pages → Source: "GitHub Actions" once.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # once a day, so the stars and the "active" badges stay fresh
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
